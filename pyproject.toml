[build-system]
requires = [
  "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
name = "fuse-element"
version = "0.1.1"
authors = [
  {name = "India Marsden", email = "marsden@maths.ox.ac.uk"},
]
description = "a unified, serialisable representation of a Finite Element"
readme = "README.md"
classifiers = [
  "Programming Language :: Python",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "networkx",
  "sympy",
  "scipy",
  "matplotlib",
  "recursivenodes",
]

[project.urls]
Repository = "https://github.com/firedrakeproject/fuse.git"

[project.optional-dependencies]
# FIAT and UFL are imported directly, but come from the Firedrake stack and are
# installed alongside it. Kept as an extra so that installing FUSE cannot pull
# in a conflicting copy, and to avoid a cycle with firedrake-fiat.
firedrake = [
  "fenics-ufl",
  "firedrake-fiat",
]
docs = [
  "sphinx",
  "numpydoc",
  "sphinx-bootstrap-theme",
  "sphinx_design",
  "sphinxcontrib-fulltoc",
  "sphinx_remove_toctrees",
]
dev = [
  "pytest",
  "pytest-mock",
  "pytest-timeout",
  "coverage",
  "flake8",
]


[tool.pytest.ini_options]
testpaths = [
    "test",
]
markers = [
    "smoke: fast tests that do not require Firedrake (see conftest.SMOKE_MODULES)",
    "slow: builds that take minutes (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
include=[
    "fuse/*",
]
