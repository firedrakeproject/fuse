name: Run lint

on:
  # Push to main or PR
  push:
    branches:
      - main
  pull_request:

jobs:
  linter:
    name: "Run linter"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup flake8 annotations
        uses: rbialon/flake8-annotations@v1
      - name: Install linter
        run: |
          pip install flake8
      - name: Lint codebase
        run: |
          make lint GITHUB_ACTIONS_FORMATTING=1